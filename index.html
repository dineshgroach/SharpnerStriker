<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sharpener Flick — flick a sharpener across a newspaper page. A lo-fi pixel physics game."
    />
    <meta name="theme-color" content="#141414" />
    <link
      rel="preload"
      href="/assets/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Critical for first paint: Page1 + sharpener are needed to become playable. -->
    <link
      rel="preload"
      href="/assets/Pages/Page1.png"
      as="image"
      type="image/png"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="/assets/Sharpner/sharpener-cut.png"
      as="image"
      type="image/png"
      fetchpriority="high"
    />
    <!-- Prefetch remaining pages with low priority — loaded lazily after Page1 (see GameScene.ts) -->
    <link rel="prefetch" href="/assets/Pages/Page2.png" as="image" />
    <link rel="prefetch" href="/assets/Pages/Page3.png" as="image" />
    <link rel="prefetch" href="/assets/Pages/Page4.png" as="image" />
    <link rel="prefetch" href="/assets/Pages/Page5.png" as="image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23141414%22/><rect x=%2218%22 y=%2218%22 width=%2264%22 height=%2264%22 fill=%22%23ffa133%22/></svg>"
    />
    <title>Sharpener Flick</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
