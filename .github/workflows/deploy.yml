name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (with Pages base)
        # vite.config.ts reads GH_PAGES_BASE and sets base: '/<REPO>/'
        # For project site https://<user>.github.io/<repo>/ this is required.
        # For user site https://<user>.github.io/ (repo = <user>.github.io) keep base '/'
        # so the env is auto-skipped for *.github.io repos.
        run: |
          if [[ "${{ github.event.repository.name }}" == *".github.io" ]]; then
            echo "User site detected — building with base '/'"
            npm run build
          else
            echo "Project site detected — building with base '/${{ github.event.repository.name }}/'"
            GH_PAGES_BASE="${{ github.event.repository.name }}" npm run build
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
